spring.application.name=Gestion_Sinistre
server.port=8098

# PostgreSQL DB config
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_sinistre
spring.datasource.username=keycloak
spring.datasource.password=keycloak
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA with PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keycloak Configuration
keycloak.realm=Gestion_Sinistre
keycloak.auth-server-url=http://localhost:9090/auth
keycloak.resource=backend
keycloak.public-client=false
keycloak.bearer-only=true
keycloak.enabled=true
